# =========================
# General appearance
# =========================

# monitor=,preferred,auto,auto
monitor = eDP-1, preferred, auto, 1.25

# attempt to fix typst preview cursor desyncing when switching window panes
cursor{
  no_warps = false
}

general {

    gaps_in = 6
    gaps_out = 10
    layout = dwindle

    # col.active_border = rgba(137,180,250,180)
    # col.inactive_border = rgba(30,30,46,120)
    border_size = 4

    # col.active_border   = rgba(137,180,250,255)
    # col.inactive_border = rgba(49,50,68,120)
    col.active_border   = rgba(137,180,250,255)
    col.inactive_border = rgba(49,50,68,50)


}

# input {
#     accel_profile = flat
#     follow_mouse = 1
#   touchpad{
#     natural_scroll = no
#   }
#   sensitivity = 0
#   force_no_accel = 1
# }
input {
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
    }
    #sensitivity = 0
    #force_no_accel = 1
    # numlock_by_default =true
    # accel_profile =  flat
    sensitivity = 5 # -1.0 - 1.0, 0 means no modification.
    force_no_accel = 1
}


  


